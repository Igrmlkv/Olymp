name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # v4 targets Node 20, which the runners force onto Node 24 with a
      # deprecation warning. v5 is the match for this project: it ships on
      # Node 24, while v6 carries the pnpm 11 installer and warns about the
      # v10 layout we pin. Bump to v6 when the project moves to pnpm 11.
      # Version comes from `packageManager` in package.json; setting it here too is an error.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
